[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-peer-chat"
version = "0.5.4"
description = "Durable messaging between existing local Codex and Claude Code sessions"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8; sys_platform == 'darwin'"]

[project.urls]
Repository = "https://github.com/Sapien3/peer-chat"
Issues = "https://github.com/Sapien3/peer-chat/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
peer-chat = "peer_chat:main"
peer-chat-hook = "peer_hooks:main"
peer-chat-setup = "peer_setup:main"

[tool.setuptools]
py-modules = ["peer_chat", "peer_hooks", "peer_setup", "peer_platform", "peer_codex", "peer_registry", "peer_connect", "peer_budget", "peer_wake", "peer_peers", "peer_observe", "peer_delivery", "peer_watch"]
packages = ["peer_chat_assets"]

[tool.setuptools.package-data]
peer_chat_assets = ["SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
